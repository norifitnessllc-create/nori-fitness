<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nori-Fitness LLC | Reset Password</title>
  <link rel="stylesheet" href="style.css"/>
</head>

<body>
  <header class="reset-header">
    <div class="reset-header-inner">
      <a href="index.html" class="reset-logo-link">
        <img src="logo.png" alt="Nori-Fitness LLC" class="reset-logo">
      </a>

      <div class="reset-header-copy">
        <h1>Reset Password</h1>
        <p>Train Strong | Live Confident</p>
      </div>
    </div>
  </header>

  <main class="reset-page">
    <section class="reset-hero-card">
      <div class="reset-hero-pill">Account Access</div>
      <h2>Create your new password</h2>
      <p>
        Enter and confirm your new password below to regain access to your account.
      </p>
    </section>

    <section class="reset-form-card">
      <form id="resetPasswordForm" class="reset-form">
        <div class="reset-field">
          <label for="newPassword">New Password</label>

          <div class="password-wrap">
            <input
              type="password"
              id="newPassword"
              class="reset-input"
              required
              autocomplete="new-password"
              placeholder="Enter new password"
            />
            <button
              type="button"
              id="toggleNewPassword"
              class="password-toggle"
              aria-label="Show password"
              title="Show password"
            >
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="reset-field">
          <label for="confirmNewPassword">Confirm New Password</label>

          <div class="password-wrap">
            <input
              type="password"
              id="confirmNewPassword"
              class="reset-input"
              required
              autocomplete="new-password"
              placeholder="Confirm new password"
            />
            <button
              type="button"
              id="toggleConfirmNewPassword"
              class="password-toggle"
              aria-label="Show password"
              title="Show password"
            >
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="reset-btn">
          Save New Password
        </button>

        <p id="message" class="reset-message">Ready.</p>

        <p class="reset-back-link">
          Return to <a href="login.html">Login</a>
        </p>
      </form>
    </section>
  </main>

  <footer class="reset-footer">
    <nav>
      <div class="logo">
        <a href="index.html" class="logo">
          <img src="logo.png" alt="Nori-Fitness LLC">
        </a>
      </div>
      © 2026 Nori-Fitness LLC. All Rights Reserved. |
      <a href="terms.html">Terms</a> |
      <a href="privacy.html">Privacy</a>
    </nav>
  </footer>

  <style>
    :root{
      --nf-cream:#e9e4d7;
      --nf-card:#f7f3ec;
      --nf-line:rgba(36,25,19,0.08);
      --nf-ink:#241913;
      --nf-muted:#62574c;
      --nf-earth:#b07a3f;
      --nf-olive:#7e9362;
      --nf-olive-dark:#576b46;
      --nf-shadow:0 14px 34px rgba(54, 40, 27, 0.10);
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      background:var(--nf-cream);
      color:var(--nf-ink);
      font-family:"Inter", sans-serif;
    }

    .reset-header{
      background:rgba(239,233,221,0.96);
      backdrop-filter:blur(10px);
      border-bottom:1px solid var(--nf-line);
      position:sticky;
      top:0;
      z-index:1000;
    }

    .reset-header-inner{
      max-width:1440px;
      margin:0 auto;
      padding:18px 22px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:18px;
    }

    .reset-logo-link{
      display:inline-flex;
      align-items:center;
      flex:0 0 auto;
    }

    .reset-logo{
      width:86px;
      height:auto;
      display:block;
    }

    .reset-header-copy{
      text-align:right;
      margin-left:auto;
    }

    .reset-header-copy h1{
      margin:0;
      font-family:"Poppins", sans-serif;
      font-weight:800;
      font-size:42px;
      line-height:0.95;
      color:var(--nf-olive-dark);
      letter-spacing:-0.03em;
      text-shadow:0 4px 10px rgba(0,0,0,0.10);
    }

    .reset-header-copy p{
      margin:6px 0 0 0;
      font-family:"Poppins", sans-serif;
      font-weight:700;
      font-size:18px;
      color:var(--nf-earth);
      text-transform:uppercase;
      letter-spacing:0.03em;
      text-shadow:0 4px 10px rgba(0,0,0,0.10);
    }

    .reset-page{
      max-width:920px;
      margin:0 auto;
      padding:34px 20px 48px;
    }

    .reset-hero-card,
    .reset-form-card{
      background:rgba(250,247,241,0.92);
      border:1px solid var(--nf-line);
      border-radius:30px;
      box-shadow:var(--nf-shadow);
    }

    .reset-hero-card{
      text-align:center;
      padding:30px 28px;
      margin-bottom:22px;
    }

    .reset-hero-pill{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:10px 16px;
      border-radius:999px;
      border:1px solid var(--nf-line);
      background:rgba(126,147,98,0.10);
      color:var(--nf-olive-dark);
      font-family:"Poppins", sans-serif;
      font-size:14px;
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:0.03em;
      margin-bottom:18px;
    }

    .reset-hero-card h2{
      margin:0;
      font-family:"Poppins", sans-serif;
      font-size:48px;
      line-height:0.98;
      letter-spacing:-0.04em;
      color:var(--nf-ink);
      text-shadow:0 4px 10px rgba(0,0,0,0.10);
    }

    .reset-hero-card p{
      max-width:700px;
      margin:14px auto 0;
      color:#685c50;
      font-size:18px;
      font-weight:700;
      line-height:1.75;
      text-shadow:0 3px 8px rgba(0,0,0,0.08);
    }

    .reset-form-card{
      padding:28px 24px 26px;
    }

    .reset-form{
      max-width:460px;
      margin:0 auto;
      width:100%;
    }

    .reset-field{
      margin-bottom:14px;
    }

    .reset-field label{
      display:block;
      margin-bottom:8px;
      font-size:15px;
      font-weight:800;
      color:var(--nf-ink);
    }

    .password-wrap{
      position:relative;
    }

    .reset-input{
      width:100%;
      padding:14px 48px 14px 16px;
      border-radius:16px;
      border:1px solid rgba(36,25,19,0.12);
      background:#f4efe6;
      color:var(--nf-ink);
      font-size:16px;
      font-weight:600;
      outline:none;
      transition:border-color 140ms ease, box-shadow 140ms ease, background 140ms ease;
    }

    .reset-input:focus{
      border-color:rgba(87,107,70,0.42);
      box-shadow:0 0 0 4px rgba(126,147,98,0.12);
      background:#fbf8f2;
    }

    .password-toggle{
      position:absolute;
      right:12px;
      top:50%;
      transform:translateY(-50%);
      border:0;
      background:transparent;
      cursor:pointer;
      padding:0;
      display:flex;
      align-items:center;
      justify-content:center;
      width:24px;
      height:24px;
      color:#241913;
    }

    .reset-btn{
      width:100%;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border:none;
      border-radius:16px;
      background:#829660;
      color:#fff;
      font-family:"Inter", sans-serif;
      font-weight:800;
      font-size:17px;
      padding:15px 18px;
      cursor:pointer;
      box-shadow:0 8px 18px rgba(87,107,70,0.24);
      margin-top:6px;
    }

    .reset-btn:hover{
      background:#728654;
    }

    .reset-message{
      margin-top:16px;
      font-weight:800;
      text-align:center;
      color:var(--nf-ink);
    }

    .reset-back-link{
      margin-top:16px;
      text-align:center;
      font-weight:700;
      color:#5f5449;
    }

    .reset-back-link a{
      color:var(--nf-olive-dark);
      text-decoration:none;
      font-weight:800;
    }

    .reset-footer{
      margin-top:30px;
      padding:22px 20px 34px;
      text-align:center;
      color:#4f473e;
    }

    .reset-footer nav{
      display:flex;
      justify-content:center;
      align-items:center;
      flex-wrap:wrap;
      gap:10px;
    }

    .reset-footer .logo img{
      width:40px;
      height:auto;
      display:block;
    }

    .reset-footer a{
      color:#4f473e;
      text-decoration:none;
    }

    @media (max-width:860px){
      .reset-header-inner{
        padding:14px 16px;
        gap:14px;
      }

      .reset-logo{
        width:64px;
      }

      .reset-header-copy h1{
        font-size:28px;
      }

      .reset-header-copy p{
        font-size:14px;
      }

      .reset-page{
        padding:18px 14px 34px;
      }

      .reset-hero-card,
      .reset-form-card{
        border-radius:24px;
      }

      .reset-hero-card{
        padding:22px 18px;
      }

      .reset-form-card{
        padding:22px 18px 24px;
      }

      .reset-hero-card h2{
        font-size:34px;
      }

      .reset-hero-card p{
        font-size:16px;
      }
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="script.js"></script>
  <script src="reset-password.js"></script>
</body>
</html>
